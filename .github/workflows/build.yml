name: Build EaglerCity

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate plugin YAML resources
        run: |
          ruby -ryaml -e 'ARGV.each { |file| YAML.load_file(file) }' src/main/resources/plugin.yml src/main/resources/config.yml
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("src/main/resources").rglob("*.yml"):
              contents = path.read_text(encoding="utf-8")
              if r"\n" in contents:
                  raise SystemExit(f"Literal escaped newline in YAML resource: {path}")
          print("YAML resources passed parsing and newline validation")
          PY

      - name: Build plugin
        run: mvn -B clean package

      - name: Stage distributable JAR
        run: |
          mkdir -p dist
          cp target/EaglerCity-1.1.0.jar dist/EaglerCity-1.1.0.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EaglerCity-1.1.0
          path: dist/EaglerCity-1.1.0.jar

      - name: Keep latest JAR in repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/EaglerCity-1.1.0.jar
          if ! git diff --cached --quiet; then
            git commit -m "Build EaglerCity 1.1.0"
            git push
          fi
