# EaglerCity 1.1.0
#
# The plugin deliberately owns one compact town per enabled Overworld.
# It does not modify unrelated vanilla villages or iron golems.

enabled-worlds: []

town:
  distance-from-spawn: 96
  radius: 42
  search-candidates: 24
  residents-per-profession: 2

activity:
  # Residents receive one pathfinding decision about every three seconds.
  tick-ticks: 60
  work-start-time: 1000
  home-start-time: 12500
  low-stock-ratio: 0.80
  work-arrival-radius: 2.75
  work-cooldown-ticks: 300
  wander-change-ticks: 300
  work-speed: 0.90
  social-speed: 0.85
  wander-speed: 0.72
  home-speed: 0.82

economy:
  heartbeat-ticks: 100
  trade-radius: 10.0\n  trade-reserve-ratio: 0.85
  trade-start-time: 8500
  trade-end-time: 12000
  trade-cooldown-ticks: 400
  max-transfer-per-item: 8
  daily-stock-enabled: true
  daily-production-enabled: true

security:
  check-interval-ticks: 600
  villagers-per-golem: 5
  max-golems: 4
  alert-range: 48.0
  panic-speed: 1.35
  golem-damage-multiplier: 5.0
